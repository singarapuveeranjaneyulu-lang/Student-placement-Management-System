<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2>Student MS</h2>

            <nav>

                <a href="index.html" class="active">
                    Dashboard
                </a>

                <a href="students.html">
                    Students
                </a>

                <a href="add-student.html">
                    Add Student
                </a>

            </nav>

        </aside>

        <!-- Main -->
        <main class="main">

            <header class="topbar">

                <h1>Dashboard</h1>

            </header>

            <section class="dashboard">

                <div class="card">

                    <h3>Total Students</h3>

                    <p id="totalStudents">0</p>

                </div>

                <div class="card">

                    <h3>Total Courses</h3>

                    <p id="totalCourses">0</p>

                </div>

                <div class="card">

                    <h3>Total Departments</h3>

                    <p id="totalDepartments">0</p>

                </div>

            </section>

            <section class="content-card">

                <div class="section-header">

                    <h2>Recent Students</h2>

                    <a href="students.html" class="btn">
                        View All
                    </a>

                </div>

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Course</th>
                                <th>Department</th>
                            </tr>

                        </thead>

                        <tbody id="recentStudents">

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
