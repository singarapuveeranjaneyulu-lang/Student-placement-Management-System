<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <h2>Student MS</h2>

        <nav>

            <a href="index.html">
                Dashboard
            </a>

            <a href="students.html"
               class="active">
                Students
            </a>

            <a href="add-student.html">
                Add Student
            </a>

        </nav>

    </aside>


    <main class="main">

        <header class="topbar">

            <h1>Edit Student</h1>

        </header>


        <section class="content-card">

            <form id="editStudentForm">

                <input
                    type="hidden"
                    id="editId"
                >


                <div class="form-grid">

                    <div class="form-group">

                        <label>Name</label>

                        <input
                            type="text"
                            id="editName"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Email</label>

                        <input
                            type="email"
                            id="editEmail"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Phone</label>

                        <input
                            type="text"
                            id="editPhone"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Age</label>

                        <input
                            type="number"
                            id="editAge"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Gender</label>

                        <select id="editGender" required>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Course</label>

                        <input
                            type="text"
                            id="editCourse"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Department</label>

                        <input
                            type="text"
                            id="editDepartment"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Year</label>

                        <select id="editYear" required>

                            <option value="1">
                                1st Year
                            </option>

                            <option value="2">
                                2nd Year
                            </option>

                            <option value="3">
                                3rd Year
                            </option>

                            <option value="4">
                                4th Year
                            </option>

                        </select>

                    </div>


                    <div class="form-group full">

                        <label>Address</label>

                        <textarea
                            id="editAddress"
                            rows="4">
                        </textarea>

                    </div>

                </div>


                <div id="editMessage"></div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn">
                        Update Student
                    </button>

                    <a
                        href="students.html"
                        class="btn secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </section>

    </main>

</div>

<script src="js/script.js"></script>

</body>

</html>
